version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chalk-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: chalk
      POSTGRES_PASSWORD: chalk_dev_password
      POSTGRES_DB: chalk
    volumes:
      - chalk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chalk']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chalk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - chalk_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chalk_pgdata:
  chalk_redis_data:
