services:
  # ─── Chalk Application (Backend + Worker + Frontend) ──
  chalk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalk-app
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://chalk:chalk_dev_password@postgres:5432/chalk
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3001
    volumes:
      - chalk_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── PostgreSQL with pgvector ─────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chalk-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: chalk
      POSTGRES_PASSWORD: chalk_dev_password
      POSTGRES_DB: chalk
    volumes:
      - chalk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chalk']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chalk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - chalk_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chalk_pgdata:
  chalk_redis_data:
  chalk_uploads:
